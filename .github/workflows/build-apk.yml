# A sideloadable APK built on a Linux runner: the runtime bundle (PRoot + Ubuntu + Node +
# patched DSH + bundled plugins) is produced here, then tooling/build-apk.sh packages it.
# Nothing is published; the APK is an artifact of the run.
#
# Release builds verify runtime/out before Gradle starts (tooling/check_runtime_bundle.py),
# so the runtime step must come first. The l10n outputs are generated from the ARB parts
# because Flutter tooling is required to do it; `python3 app/tool/l10n_merge.py` writes
# app/lib/l10n/gen, which the Dart code compiles against.
#
# Signing: with no repository secrets the release build falls back to the packaging
# machine's debug key (see docs/release.md «签名»), which installs but cannot cover an
# official build (Android refuses a different signer). Set all four secrets below to sign
# with the release key instead:
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Test APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 目标架构（arm64 真机，x64 模拟器）
        type: choice
        options: [arm64, x64]
        default: arm64
      build_name:
        description: versionName，留空用 app/pubspec.yaml
        type: string
        default: ''
      build_number:
        description: versionCode，留空用构建分钟
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: ${{ inputs.flavor }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The runner image's SDK has some of these; ask for the versions Flutter's Gradle
      # plugin defaults to (compileSdk, NDK) instead of guessing them.
      - name: Android SDK packages Flutter asks for
        run: |
          flutter_gradle=$(grep -rlE 'ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main" | head -1)
          ndk=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$flutter_gradle" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          sdk=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$flutter_gradle" | grep -oE '[0-9]+$' | head -1)
          echo "flutter defaults: compileSdk=${sdk:-none} ndk=${ndk:-none}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          packages=("platform-tools" "platforms;android-${sdk}" "build-tools;${sdk}.0.0")
          [[ -n $ndk ]] && packages+=("ndk;$ndk")
          "$sdkmanager" "${packages[@]}"

      - name: Host tools the runtime build needs
        run: |
          command -v gpgv >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gpgv

      - name: Flutter packages, local.properties and the Gradle wrapper
        working-directory: app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so the build VM brings Gradle (same as ci.yml's android job).
      - &gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Write the wrapper Flutter will call
        working-directory: app/android
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all
          # Keep the mirror the repository already points at; the default URL is slow here.
          sed -i "s#^distributionUrl=.*#distributionUrl=https\\\\://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-all.zip#" \
            gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # The generated localizations are tracked but stale inputs fail to compile; regenerating
      # them here is the same command CONTRIBUTING.md asks for before a build.
      - name: Generate the localizations
        run: python3 app/tool/l10n_merge.py

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z $KEYSTORE_BASE64 ]]; then
            echo "::notice::没有配置发布密钥：release 包用 debug 签名，可安装，但不能覆盖官方签名的旧版"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          (umask 077
           {
             echo "storeFile=$RUNNER_TEMP/release.jks"
             echo "storePassword=$KEYSTORE_PASSWORD"
             echo "keyAlias=$KEY_ALIAS"
             echo "keyPassword=$KEY_PASSWORD"
           } > app/android/key.properties)
          echo "::notice::使用仓库密钥签名"

      - name: Restore runtime downloads
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-cache-v1-${{ runner.os }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/**', 'runtime/locks/**', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/root-exec/**', 'runtime/skills/**') }}

      - name: Build the runtime bundle
        env:
          RUNTIME_INPUT_STORE_URL: ${{ secrets.RUNTIME_INPUT_STORE_URL }}
        run: |
          case "${{ inputs.flavor }}" in
            arm64) abi=arm64-v8a ;;
            x64) abi=x86_64 ;;
          esac
          bash runtime/build-runtime.sh "$abi"

      # Saved right after the build so a later failure does not throw the downloads away.
      - name: Keep runtime downloads
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Build the APK
        env:
          FLAVOR: ${{ inputs.flavor }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=(-f "$FLAVOR")
          if [[ -n $BUILD_NAME ]]; then args+=(--build-name "$BUILD_NAME"); fi
          if [[ -n $BUILD_NUMBER ]]; then args+=(--build-number "$BUILD_NUMBER"); fi
          bash tooling/build-apk.sh "${args[@]}"

      - name: Say what was built
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          apk="app/build/app/outputs/flutter-apk/app-$FLAVOR-release.apk"
          {
            echo "### $(basename "$apk")"
            "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$apk" | sed -n '/^package:/p'
            echo
            sha256sum "$apk"
            ls -l "$apk"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-${{ inputs.flavor }}-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
