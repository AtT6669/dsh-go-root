# Builds the root-flavored arm64 APK on GitHub-hosted runners.
#
# Why a separate workflow: the root build needs an extra native artifact
# (libdsh-root-exec.so, built by tooling/build-root-exec.sh with the NDK) and
# the bundled Linux runtime. The normal CI never packages an APK.
#
#   Actions -> Root APK -> Run workflow
#
name: Root APK

on:
  workflow_dispatch:
  push:
    branches: [main, root-build]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/build-root-exec.sh'
      - '.github/workflows/root-apk.yml'

permissions:
  contents: read

concurrency:
  group: root-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  UV_USE_IO_URING: 0

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || sdkmanager="$sdk/tools/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          # NDK 28.2 is what tawcroot pins; the static helper builds with it too.
          yes | "$sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the static chroot helper
        run: |
          chmod +x tooling/build-root-exec.sh
          tooling/build-root-exec.sh
          file app/build/root-exec/arm64-v8a/libdsh-root-exec.so

      - name: Cache the bundled runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime/.cache
            runtime/out
            runtime/out-tawcroot
          key: root-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/rtbuild.py', 'runtime/locks/**', 'runtime/patches/**') }}

      - name: Build the Linux runtime (arm64)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: runtime/build-runtime.sh arm64-v8a

      - name: Fetch Dart packages
        working-directory: app
        run: flutter pub get

      - name: Build the root APK
        run: tooling/build-apk.sh -f arm64 --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
