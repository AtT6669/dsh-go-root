# TEMPORARY push-triggered mirror of build-apk.yml + goldens.yml, for when the
# actions dispatch API is not available to the CI token. It only fires on pushes
# that touch this file, so it runs once when added and once when deleted-adjacent
# pushes occur. Delete this file once a proper dispatch flow is restored.
name: APK Auto

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-auto.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-auto-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  # Aliyun Maven mirrors are slow and unreliable from a US runner.
  DSH_MAVEN_MIRRORS: '0'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  TZ: Asia/Shanghai

jobs:
  apk:
    name: APK arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Accept Android SDK licenses and install build tools
        run: |
          yes | flutter doctor --android-licenses >/dev/null || true
          flutter config --no-analytics
          flutter precache --android

      - name: Restore runtime download cache
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-cache-${{ runner.os }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/patches/pins.json') }}

      - name: Build the runtime bundle
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Save runtime download cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Generate localizations and local.properties
        run: |
          python3 app/tool/l10n_merge.py
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties

      - name: Build the APK
        run: bash tooling/build-apk.sh -f arm64 --build-name 1.0.16

      - name: Compute APK checksums
        run: |
          cd app/build/app/outputs/flutter-apk
          sha256sum *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  goldens:
    name: Render goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore golden fonts
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - name: Save golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - name: Install golden fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Run Flutter tests and render new goldens
        id: render
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.exit(subprocess.call(['flutter', 'test', '--no-pub', '--update-goldens',
                                    '--concurrency=4', '--reporter', 'github', 'test']))
          PY
      - name: Collect changed golden images
        if: always() && steps.render.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          repo = Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip())
          changes = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z',
                                             '--untracked-files=all', '--no-renames', '--', 'test'])
          out = Path(os.environ['RUNNER_TEMP']) / 'golden-updates'
          out.mkdir()
          rendered = []
          for record in sorted(changes.split(b'\0')):
              if not record:
                  continue
              relative = Path(os.fsdecode(record[3:]))
              image = repo / relative
              if relative.parts[:2] != ('app', 'test') or 'goldens' not in relative.parts or image.suffix != '.png' or not image.is_file():
                  continue
              target = out / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(image, target)
              rendered.append(relative.as_posix())
          (out / 'changed-files.txt').write_text('\n'.join(rendered) + '\n')
          (out / 'STATUS.txt').write_text(
              'commit: ' + os.environ['GITHUB_SHA'] + '\n'
              'changed-goldens: ' + str(len(rendered)) + '\n'
              'Only changed or new golden images are included; review before replacing baselines.\n')
          print(f'Collected {len(rendered)} changed goldens')
          PY
      - name: Upload changed golden images
        if: always() && steps.render.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-updates-${{ github.sha }}
          path: ${{ runner.temp }}/golden-updates/
          if-no-files-found: error
          retention-days: 7
